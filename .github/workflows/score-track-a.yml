name: Score Track A

on:
  workflow_dispatch:
    inputs:
      horizon:
        description: Months from the frozen cutoff
        type: choice
        options: ["12", "24"]
        default: "12"
        required: true
      release_doi:
        description: Exact Zenodo version DOI (defaults to TRACKA_RELEASE_DOI)
        type: string
      freeze_sha256:
        description: OSF update 4 manifest SHA-256 (defaults to TRACKA_FREEZE_SHA256)
        type: string
      synthetic:
        description: Run only the network-free synthetic readout fixtures
        type: boolean
        default: false
  schedule:
    # POSIX cron has no year field. The setup step selects 2027 and 2028.
    - cron: "17 14 1 12 *"

permissions:
  contents: read

jobs:
  synthetic:
    if: github.event_name == 'workflow_dispatch' && inputs.synthetic
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"
      - name: Install the scorer dependency
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r loe-bench/requirements-tracka.lock
      - name: Run the synthetic readout fixtures
        working-directory: loe-bench
        run: python -m unittest -v loe_bench.tests.test_tracka_readout loe_bench.tests.test_tracka_secondary
  select:
    if: github.event_name != 'workflow_dispatch' || !inputs.synthetic
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    outputs:
      horizon: ${{ steps.readout.outputs.horizon }}
    steps:
      - name: Select the scheduled or requested horizon
        id: readout
        env:
          REQUESTED_HORIZON: ${{ inputs.horizon }}
          RELEASE_DOI: ${{ inputs.release_doi || vars.TRACKA_RELEASE_DOI }}
          FREEZE_SHA256: ${{ inputs.freeze_sha256 || vars.TRACKA_FREEZE_SHA256 }}
        run: |
          horizon="$REQUESTED_HORIZON"
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            case "$(date -u +%Y)" in
              2027) horizon=12 ;;
              2028) horizon=24 ;;
              *) exit 0 ;;
            esac
          fi
          [[ "$horizon" == 12 || "$horizon" == 24 ]]
          if [[ ! "$RELEASE_DOI" =~ ^(https://doi\.org/)?10\.5281/zenodo\.[0-9]+$ || ! "$FREEZE_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Set the Zenodo version DOI and exact OSF freeze-manifest SHA-256 before running."
            exit 1
          fi
          echo "horizon=$horizon" >> "$GITHUB_OUTPUT"
  readout:
    needs: select
    if: needs.select.outputs.horizon != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    concurrency:
      group: score-track-a-publication
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"
      - name: Install the scorer dependency
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r loe-bench/requirements-tracka.lock
      - name: Score the frozen release
        id: score
        working-directory: loe-bench
        env:
          HORIZON: ${{ needs.select.outputs.horizon }}
          RELEASE_DOI: ${{ inputs.release_doi || vars.TRACKA_RELEASE_DOI }}
          FREEZE_SHA256: ${{ inputs.freeze_sha256 || vars.TRACKA_FREEZE_SHA256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          prior=()
          if [[ "$HORIZON" == 24 ]]; then
            prior=(--repository "$GITHUB_REPOSITORY")
          fi
          status=0
          summary=$(python -m loe_bench.tracka_readout --release "$RELEASE_DOI" --horizon "$HORIZON" \
            --freeze-sha256 "$FREEZE_SHA256" --out ../track-a-results "${prior[@]}") || status=$?
          printf '%s\n' "$summary"
          case "$status" in
            0|2|3)
              folder="${summary#* }"
              cat "$folder/REPORT.md" >> "$GITHUB_STEP_SUMMARY"
              printf 'folder=%s\n' "${folder#../}" >> "$GITHUB_OUTPUT"
              ;;
            *) exit "$status" ;;
          esac
      - name: Upload readout and source provenance
        if: steps.score.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: track-a-${{ needs.select.outputs.horizon }}m
          path: track-a-results/
          if-no-files-found: error
          retention-days: 90
      - name: Record the canonical readout
        if: >-
          steps.score.outcome == 'success' && github.ref_name == github.event.repository.default_branch &&
          github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
          HORIZON: ${{ needs.select.outputs.horizon }}
          RELEASE_DOI: ${{ inputs.release_doi || vars.TRACKA_RELEASE_DOI }}
          FREEZE_SHA256: ${{ inputs.freeze_sha256 || vars.TRACKA_FREEZE_SHA256 }}
          CANONICAL_DOI: ${{ vars.TRACKA_RELEASE_DOI }}
          CANONICAL_FREEZE: ${{ vars.TRACKA_FREEZE_SHA256 }}
          FOLDER: ${{ steps.score.outputs.folder }}
        run: |
          if [[ "${RELEASE_DOI#https://doi.org/}" != "${CANONICAL_DOI#https://doi.org/}" ||
                "$FREEZE_SHA256" != "$CANONICAL_FREEZE" ]]; then
            echo "This run used non-canonical inputs. The report is available in the run artifacts."
            exit 0
          fi
          folder="$FOLDER"
          status=$(jq -er '.status | select(. == "SCORED" or . == "PENDING" or . == "BLOCKED_SOURCE")' "$folder/results.json")
          maturity=$(jq -er '.maturity' "$folder/results.json")
          started=$(jq -er '.scored_on_utc' "$folder/results.json")
          title="Track A ${HORIZON}-month readout"
          record="${FREEZE_SHA256}:${RELEASE_DOI##*.}"
          scored_marker="<!-- tracka:${HORIZON}:SCORED:${record} -->"
          endpoint="repos/$GITHUB_REPOSITORY/issues"
          issues=$(gh api --paginate --slurp "$endpoint?state=all&per_page=100")
          recorded=false
          if jq -e --arg title "$title" --arg marker "$scored_marker" '
            any(.[][]; .title == $title and (.pull_request | not) and
              (.user.login == "github-actions[bot]" or
                (.author_association | IN("OWNER", "MEMBER", "COLLABORATOR"))) and
              ((.body // "") | gsub("\r"; "") | split("\n") | index($marker) != null))
          ' <<< "$issues" > /dev/null; then
            recorded=true
          fi
          release_sha=$(jq -er '.release_sha256' "$folder/results.json")
          tag="track-a-${HORIZON}m-${RELEASE_DOI##*.}-${FREEZE_SHA256}"
          archive_folder=$(mktemp -d)
          discover() {
            PYTHONPATH=loe-bench python -m loe_bench.tracka_vintage --repository "$GITHUB_REPOSITORY" \
              --doi "$RELEASE_DOI" --freeze-sha256 "$FREEZE_SHA256" --release-sha256 "$release_sha" \
              --horizon "$HORIZON" --out "$archive_folder"
          }
          print_pins() {
            printf 'First result SHA-256 `%s`.\n\nFDA source manifest SHA-256 `%s`.\n\nBootstrap draws SHA-256 `%s`.\n\nReport SHA-256 `%s`.\n\n' "$@"
          }
          evidence=$(discover)
          if [[ "$(jq -r '.reason // empty' <<< "$evidence")" == MISSING_ORIGINAL ]]; then
            if [[ "$recorded" == true ]] || jq -e '.original.issue_url' <<< "$evidence" > /dev/null; then
              echo "::error::A first readout issue survives without its archive. Recover the first release."
              exit 1
            fi
            if [[ "$status" == SCORED ]]; then
              if [[ "$HORIZON" == 24 ]] && ! jq -e '.h3_input.status | IN("FIRST_PUBLISHED", "REVISED_VINTAGE")' \
                "$folder/results.json" > /dev/null; then
                echo "::error::H3 input is unverified. Inspect the descriptive run artifact and recover the first publication."
                exit 1
              fi
              (cd "$folder" && sha256sum results.json > results.sha256)
              read -r result_sha _ < "$folder/results.sha256"
              read -r source_sha _ < <(sha256sum "$folder/outcome-source-manifest.json")
              read -r draws_sha _ < <(sha256sum "$folder/bootstrap-draws.npz")
              read -r report_sha _ < <(sha256sum "$folder/REPORT.md")
              notes=$(mktemp)
              {
                printf 'Scoring started %s UTC.\n\n' "$started"
                print_pins "$result_sha" "$source_sha" "$draws_sha" "$report_sha"
                printf '[Workflow run](%s/%s/actions/runs/%s)\n\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
                cat "$folder/REPORT.md"
              } > "$notes"
              gh release create "$tag" --repo "$GITHUB_REPOSITORY" --latest=false --target "$GITHUB_SHA" \
                --title "Track A first ${HORIZON}-month readout" --notes-file "$notes" \
                "$folder/results.json" "$folder/results.sha256" "$folder/outcome-source-manifest.json" \
                "$folder/REPORT.md" "$folder/bootstrap-draws.npz"
              evidence=$(discover)
            fi
          fi
          if jq -e '.reason == "INVALID_ORIGINAL"' <<< "$evidence" > /dev/null; then
            jq -r '.detail' <<< "$evidence"
            echo "::error::First release failed verification. Preserve its assets and investigate."
            exit 1
          fi
          archive=$(jq -r '.original.release_url // empty' <<< "$evidence")
          if [[ -n "$archive" ]]; then
            status=SCORED
            started=$(jq -er '.original.scored_on_utc' <<< "$evidence")
            if [[ "$recorded" == true ]]; then
              echo "The first canonical scored readout and archive are already verified."
              exit 0
            fi
          elif [[ "$status" == SCORED ]]; then
            echo "::error::First release is not visible yet. Retry archive verification."
            exit 1
          fi
          marker="<!-- tracka:${HORIZON}:${status}:${record} -->"
          timing="No completed readout"
          if [[ "$status" == SCORED ]]; then
            timing="On time"
            if [[ "$started" > "$maturity" ]]; then timing="Late"; fi
          fi
          number=$(jq -r --arg title "$title" \
            --arg pending "<!-- tracka:${HORIZON}:PENDING:${record} -->" \
            --arg blocked "<!-- tracka:${HORIZON}:BLOCKED_SOURCE:${record} -->" '
            [.[][] | select(.title == $title and (.pull_request | not) and .user.login == "github-actions[bot]" and
              ((.body // "") | gsub("\r"; "") | split("\n") | index($pending) != null or index($blocked) != null))]
            | first | .number // empty
          ' <<< "$issues")
          body_file=$(mktemp)
          {
            printf '%s\n\n' "$marker"
            printf '**%s**. Scoring started %s UTC. Window ends %s UTC.\n\n' "$timing" "$started" "$maturity"
            if [[ -n "$archive" ]]; then
              printf 'First publication UTC %s.\n\n' "$(jq -er '.original.published_at_utc' <<< "$evidence")"
              print_pins \
                "$(jq -er '.original.results_sha256' <<< "$evidence")" \
                "$(jq -er '.original.outcome_source_manifest_sha256' <<< "$evidence")" \
                "$(jq -er '.original.archive_sha256["bootstrap-draws.npz"]' <<< "$evidence")" \
                "$(jq -er '.original.archive_sha256["REPORT.md"]' <<< "$evidence")"
              printf 'Zenodo %s. [First readout report and durable archive](%s).\n' "$RELEASE_DOI" "$archive"
            else
              printf 'Release %s. [Workflow run and artifacts](%s/%s/actions/runs/%s).\n\n' \
                "$RELEASE_DOI" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
              cat "$folder/REPORT.md"
            fi
          } > "$body_file"
          if [[ -n "$number" ]]; then
            gh api --method PATCH "$endpoint/$number" -F "body=@$body_file" --jq '.html_url'
          else
            gh api --method POST "$endpoint" -f "title=$title" -F "body=@$body_file" --jq '.html_url'
          fi
