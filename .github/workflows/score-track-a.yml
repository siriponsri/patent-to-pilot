name: Score Track A

on:
  workflow_dispatch:
    inputs:
      horizon:
        description: Months from the frozen cutoff
        type: choice
        options: ["12", "24"]
        default: "12"
        required: true
      release_doi:
        description: Exact Zenodo version DOI (defaults to TRACKA_RELEASE_DOI)
        type: string
      freeze_sha256:
        description: OSF update 4 manifest SHA-256 (defaults to TRACKA_FREEZE_SHA256)
        type: string
      prior_12_run_id:
        description: GitHub Actions run ID of the archived first 12-month result
        type: string
  schedule:
    # POSIX cron has no year field. The setup step selects 2027 and 2028.
    - cron: "17 14 1 12 *"

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    outputs:
      horizon: ${{ steps.readout.outputs.horizon }}
    steps:
      - name: Select the scheduled or requested horizon
        id: readout
        env:
          REQUESTED_HORIZON: ${{ inputs.horizon }}
          RELEASE_DOI: ${{ inputs.release_doi || vars.TRACKA_RELEASE_DOI }}
          FREEZE_SHA256: ${{ inputs.freeze_sha256 || vars.TRACKA_FREEZE_SHA256 }}
          PRIOR_RUN_ID: ${{ inputs.prior_12_run_id }}
        run: |
          horizon="$REQUESTED_HORIZON"
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            case "$(date -u +%Y)" in
              2027) horizon=12 ;;
              2028) horizon=24 ;;
              *) exit 0 ;;
            esac
          fi
          [[ "$horizon" == 12 || "$horizon" == 24 ]]
          if [[ ! "$RELEASE_DOI" =~ ^(https://doi\.org/)?10\.5281/zenodo\.[0-9]+$ || ! "$FREEZE_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Set the Zenodo version DOI and exact OSF freeze-manifest SHA-256 before running."
            exit 1
          fi
          if [[ -n "$PRIOR_RUN_ID" ]]; then
            [[ "$horizon" == 24 && "$PRIOR_RUN_ID" =~ ^[0-9]+$ ]]
          fi
          echo "horizon=$horizon" >> "$GITHUB_OUTPUT"
  readout:
    needs: select
    if: needs.select.outputs.horizon != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: score-track-a-${{ needs.select.outputs.horizon }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ vars.TRACKA_SCORER_REF || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"
      - name: Restore archived 12-month run
        if: needs.select.outputs.horizon == '24' && inputs.prior_12_run_id != ''
        uses: actions/download-artifact@v8
        with:
          name: track-a-12m
          github-token: ${{ github.token }}
          run-id: ${{ inputs.prior_12_run_id }}
          path: prior-artifact
      - name: Install the scorer dependency
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r loe-bench/requirements-tracka.lock
      - name: Score the frozen release
        id: score
        working-directory: loe-bench
        env:
          HORIZON: ${{ needs.select.outputs.horizon }}
          RELEASE_DOI: ${{ inputs.release_doi || vars.TRACKA_RELEASE_DOI }}
          FREEZE_SHA256: ${{ inputs.freeze_sha256 || vars.TRACKA_FREEZE_SHA256 }}
          PRIOR_RUN_ID: ${{ inputs.prior_12_run_id }}
        run: |
          echo "started_utc=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          prior=()
          if [[ -n "$PRIOR_RUN_ID" ]]; then
            prior=(--prior-12 ../prior-artifact/12m/run-0001)
          fi
          status=0
          python -m loe_bench.score_release --release "$RELEASE_DOI" --horizon "$HORIZON" \
            --freeze-sha256 "$FREEZE_SHA256" --out ../track-a-results "${prior[@]}" || status=$?
          case "$status" in
            0|2|3)
              cat "../track-a-results/${HORIZON}m/run-0001/REPORT.md" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *) exit "$status" ;;
          esac
      - name: Upload readout and source provenance
        if: steps.score.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: track-a-${{ needs.select.outputs.horizon }}m
          path: track-a-results/
          if-no-files-found: error
          retention-days: 90
      - name: Record the canonical readout
        if: >-
          steps.score.outcome == 'success' && github.ref_name == github.event.repository.default_branch &&
          github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
          HORIZON: ${{ needs.select.outputs.horizon }}
          STARTED_UTC: ${{ steps.score.outputs.started_utc }}
          RELEASE_DOI: ${{ inputs.release_doi || vars.TRACKA_RELEASE_DOI }}
          FREEZE_SHA256: ${{ inputs.freeze_sha256 || vars.TRACKA_FREEZE_SHA256 }}
          CANONICAL_DOI: ${{ vars.TRACKA_RELEASE_DOI }}
          CANONICAL_FREEZE: ${{ vars.TRACKA_FREEZE_SHA256 }}
        run: |
          if [[ "${RELEASE_DOI#https://doi.org/}" != "${CANONICAL_DOI#https://doi.org/}" ||
                "$FREEZE_SHA256" != "$CANONICAL_FREEZE" ]]; then
            echo "This run used non-canonical inputs. The report is available in the run artifacts."
            exit 0
          fi
          folder="track-a-results/${HORIZON}m/run-0001"
          status=$(jq -er '.status | select(. == "SCORED" or . == "PENDING" or . == "BLOCKED_SOURCE")' "$folder/results.json")
          maturity=$(jq -er '.maturity' "$folder/results.json")
          timing="No completed readout"
          if [[ "$status" == SCORED ]]; then
            timing="On time"
            if [[ "$STARTED_UTC" > "$maturity" ]]; then timing="Late"; fi
          fi
          title="Track A ${HORIZON}-month readout"
          record="${FREEZE_SHA256}:${RELEASE_DOI##*.}"
          marker="<!-- tracka:${HORIZON}:${status}:${record} -->"
          scored_marker="<!-- tracka:${HORIZON}:SCORED:${record} -->"
          endpoint="repos/$GITHUB_REPOSITORY/issues"
          issues=$(gh api --paginate --slurp "$endpoint?state=all&per_page=100")
          if jq -e --arg title "$title" --arg marker "$scored_marker" '
            any(.[][]; .title == $title and (.pull_request | not) and
              (.user.login == "github-actions[bot]" or
                (.author_association | IN("OWNER", "MEMBER", "COLLABORATOR"))) and
              ((.body // "") | gsub("\r"; "") | split("\n") | index($marker) != null))
          ' <<< "$issues" > /dev/null; then
            echo "The first canonical scored readout is already recorded."
            exit 0
          fi
          number=$(jq -r --arg title "$title" \
            --arg pending "<!-- tracka:${HORIZON}:PENDING:${record} -->" \
            --arg blocked "<!-- tracka:${HORIZON}:BLOCKED_SOURCE:${record} -->" '
            [.[][] | select(.title == $title and (.pull_request | not) and .user.login == "github-actions[bot]" and
              ((.body // "") | gsub("\r"; "") | split("\n") | index($pending) != null or index($blocked) != null))]
            | first | .number // empty
          ' <<< "$issues")
          body_file=$(mktemp)
          {
            printf '%s\n\n' "$marker"
            printf '**%s**. Scoring started %s UTC. Window ends %s UTC.\n\n' "$timing" "$STARTED_UTC" "$maturity"
            printf 'Release %s. [Workflow run and artifacts](%s/%s/actions/runs/%s).\n\n' \
              "$RELEASE_DOI" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            if [[ "$HORIZON" == 12 && "$status" == SCORED ]]; then
              printf 'Preserve the first scored artifact before it expires so the 24-month run can reuse it.\n\n'
            fi
            cat "$folder/REPORT.md"
          } > "$body_file"
          if [[ -n "$number" ]]; then
            gh api --method PATCH "$endpoint/$number" -F "body=@$body_file" --jq '.html_url'
          else
            gh api --method POST "$endpoint" -f "title=$title" -F "body=@$body_file" --jq '.html_url'
          fi
