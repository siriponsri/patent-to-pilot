name: Score Track A

on:
  workflow_dispatch:
    inputs:
      horizon:
        description: Months from the frozen cutoff
        type: choice
        options: ["12", "24"]
        default: "12"
        required: true
      release_doi:
        description: Exact Zenodo version DOI (defaults to TRACKA_RELEASE_DOI)
        type: string
      freeze_sha256:
        description: OSF update 4 manifest SHA-256 (defaults to TRACKA_FREEZE_SHA256)
        type: string
      synthetic:
        description: Run synthetic readout fixtures and an isolated branch attestation
        type: boolean
        default: false
  schedule:
    # POSIX cron has no year field. The setup step selects 2027 and 2028.
    - cron: "17 14 1 12 *"

permissions:
  contents: read

jobs:
  synthetic:
    if: github.event_name == 'workflow_dispatch' && inputs.synthetic
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"
      - name: Install the scorer dependency
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r loe-bench/requirements-tracka.lock
      - name: Run the synthetic readout fixtures
        working-directory: loe-bench
        run: python -m unittest -v loe_bench.tests.test_tracka_readout loe_bench.tests.test_tracka_secondary
      - name: Build isolated synthetic attestation subjects
        if: github.ref_name != github.event.repository.default_branch
        run: |
          printf '%s\n' "synthetic scope $GITHUB_RUN_ID $GITHUB_RUN_ATTEMPT" > synthetic-scope.txt
          printf '%s\n' "synthetic bundle $GITHUB_RUN_ID $GITHUB_RUN_ATTEMPT" > synthetic-bundle.txt
          sha256sum synthetic-scope.txt synthetic-bundle.txt > synthetic-subjects.sha256
      - name: Attest the synthetic subjects only
        if: github.ref_name != github.event.repository.default_branch
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: synthetic-subjects.sha256
      - name: Verify the synthetic workflow identity
        if: github.ref_name != github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for subject in synthetic-scope.txt synthetic-bundle.txt; do
            gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY" \
              --cert-identity "https://github.com/$GITHUB_WORKFLOW_REF" --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners --format json |
              jq -e --arg ref "https://github.com/$GITHUB_WORKFLOW_REF" \
                --arg commit "$GITHUB_SHA" \
                --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
                'any(.[];
                  (.verificationResult.signature.certificate |
                    .buildConfigURI == $ref and .sourceRepositoryDigest == $commit and
                    .runInvocationURI == $run and .sourceRepositoryVisibilityAtSigning == "public") and
                  any(.verificationResult.verifiedTimestamps[]; .type == "Tlog") and
                  ([.verificationResult.statement.subject[].name] | sort) ==
                  ["synthetic-bundle.txt", "synthetic-scope.txt"])' > /dev/null
          done
  select:
    if: github.event_name != 'workflow_dispatch' || !inputs.synthetic
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    outputs:
      horizon: ${{ steps.readout.outputs.horizon }}
    steps:
      - name: Select the scheduled or requested horizon
        id: readout
        env:
          REQUESTED_HORIZON: ${{ inputs.horizon }}
          RELEASE_DOI: ${{ inputs.release_doi || vars.TRACKA_RELEASE_DOI }}
          FREEZE_SHA256: ${{ inputs.freeze_sha256 || vars.TRACKA_FREEZE_SHA256 }}
        run: |
          horizon="$REQUESTED_HORIZON"
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            case "$(date -u +%Y)" in
              2027) horizon=12 ;;
              2028) horizon=24 ;;
              *) exit 0 ;;
            esac
          fi
          [[ "$horizon" == 12 || "$horizon" == 24 ]]
          if [[ ! "$RELEASE_DOI" =~ ^(https://doi\.org/)?10\.5281/zenodo\.[0-9]+$ || ! "$FREEZE_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Set the Zenodo version DOI and exact OSF freeze-manifest SHA-256 before running."
            exit 1
          fi
          echo "horizon=$horizon" >> "$GITHUB_OUTPUT"
  readout:
    needs: select
    if: >-
      needs.select.outputs.horizon != '' &&
      github.repository == 'siriponsri/patent-to-pilot' &&
      github.ref == 'refs/heads/main' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      id-token: write
      attestations: write
    concurrency:
      group: score-track-a-publication
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
        working-directory: loe-bench
    env:
      HORIZON: ${{ needs.select.outputs.horizon }}
      RELEASE_DOI: ${{ inputs.release_doi || vars.TRACKA_RELEASE_DOI }}
      FREEZE_SHA256: ${{ inputs.freeze_sha256 || vars.TRACKA_FREEZE_SHA256 }}
      TRACKA_CONTINUITY_HOLD: ${{ vars.TRACKA_CONTINUITY_HOLD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"
      - name: Install the scorer dependency
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-tracka.lock
      - name: Stage blind FDA capture or restore the existing capture draft
        id: capture
        run: python -m loe_bench.tracka_publish stage capture "$GITHUB_WORKSPACE/track-a-work/capture"
      - name: Attest the capture bundle and scope
        if: steps.capture.outputs.attest == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: ${{ steps.capture.outputs.checksums }}
      - name: Verify and publish the capture before scoring
        if: steps.capture.outputs.publish == 'true'
        run: python -m loe_bench.tracka_publish publish capture "$GITHUB_WORKSPACE/track-a-work/capture"
      - name: Score the verified capture or restore the result draft
        id: result
        run: python -m loe_bench.tracka_publish stage result "$GITHUB_WORKSPACE/track-a-work/result"
      - name: Attest the result bundle and scope
        if: steps.result.outputs.attest == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: ${{ steps.result.outputs.checksums }}
      - name: Verify and publish the result
        if: steps.result.outputs.publish == 'true'
        run: python -m loe_bench.tracka_publish publish result "$GITHUB_WORKSPACE/track-a-work/result"
      - name: Verify first publication and record its issue
        run: python -m loe_bench.tracka_publish finalize result "$GITHUB_WORKSPACE/track-a-work/result"
      - name: Upload readout and source provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: track-a-${{ needs.select.outputs.horizon }}m
          path: track-a-work/result/readout/
          if-no-files-found: ignore
          retention-days: 90
