name: Track A published source pins

on:
  push:
    paths:
      - 'loe-bench/loe_bench/**'
      - 'loe-bench/requirements-tracka.lock'
      - '.github/workflows/tracka-source-pins.yml'
  pull_request:
    branches: [main, research/loe-bench]
    paths:
      - 'loe-bench/loe_bench/**'
      - 'loe-bench/requirements-tracka.lock'
      - '.github/workflows/tracka-source-pins.yml'

permissions:
  contents: read

jobs:
  source-pins:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"
      - name: Install the locked scorer dependency
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r loe-bench/requirements-tracka.lock
      - name: Check the installed scorer against the published pins
        working-directory: loe-bench
        run: >-
          python -m unittest -v
          loe_bench.tests.test_tracka_readout.ReadoutTest.test_cli_accepts_current_tree_with_published_source_pins
          loe_bench.tests.test_tracka_readout.ReadoutTest.test_published_source_pins_reject_a_change_to_each_file
