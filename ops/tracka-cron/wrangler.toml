name = "tracka-readouts"
main = "src/worker.mjs"
compatibility_date = "2026-11-28"
workers_dev = false
preview_urls = false
upload_source_maps = false

[triggers]
crons = ["13 1 * * *", "23 1 1 * *"]

[vars]
GITHUB_REPOSITORY = "OWNER/REPOSITORY"
