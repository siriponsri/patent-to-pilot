TRACKA_RELEASE_DOI = "10.5281/zenodo.24629100"
TRACKA_FREEZE_SHA256 = "8a78b318a8791649edbee2daab12a4db2d8aa72e33758cd27ae2145a9114c38d"
GITHUB_TOKEN_EXPIRES_ON = "YYYY-MM-DD"

[observability]
enabled = true
