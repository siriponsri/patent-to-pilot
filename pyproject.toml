[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patent-to-pilot"
version = "0.1.0"
description = "Local evidence workbench and reproducible retrieval-research engine for structured documents (patents, Thai official documents)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.0,<3.0", "jsonschema>=4.0,<5.0"]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]
pdf = ["pypdf>=6.0,<7.0"]  # D8 (22 Nov 2026): optional Workbench PDF text-layer ingestion
thai = ["pythainlp>=5.4,<6"]  # P4-T01a (23 Nov 2026): Thai word segmentation for the product search profile

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
