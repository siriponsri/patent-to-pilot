[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patent-to-pilot"
version = "0.1.0"
description = "Traceable HealthTech device evidence dossiers and bounded retrieval evaluation"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.0,<3.0", "jsonschema>=4.0,<5.0"]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]
pdf = ["pypdf>=6.0,<7.0"]  # D8 (22 Nov 2026): optional Workbench PDF text-layer ingestion

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
