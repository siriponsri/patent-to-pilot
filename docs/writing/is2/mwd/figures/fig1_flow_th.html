<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Window Dossier flow (TH)</title>
<style>
  body { margin: 0; background: #ffffff; }
  svg { width: 1000px; height: 540px; display: block; }
</style>
</head>
<body>
<svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mwd-flow-title mwd-flow-desc">
  <title id="mwd-flow-title">Market Window Dossier flow</title>
  <desc id="mwd-flow-desc">A user enters a molecule, dosage form, jurisdiction, decision date and planned launch date. Stage one forecasts the launch window: first-generic timing, competitors at launch, a price-erosion scenario and a demand baseline. Stage two assembles patent and exclusivity evidence and ranks what to check first. Stage three adds Thai and ASEAN registration and patent status, showing unknown where evidence is missing. Stage four produces the Market Window Dossier: a decision page for BD and R&amp;D, an FTO evaluator checklist and claim-level references. All stages read from an as-of evidence store in which every fact is dated, sourced and hashed. Development evaluation and the sealed historical test (C′) are complete; on C′ the queue passed the first registered test (H1). Prospective Track A forecasts will be frozen before 31 January 2027, before any outcome is known. The system is decision support; qualified counsel determines freedom to operate.</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(31,42,68,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0f766e"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f7f7f4"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

  <!-- Input -->
  <rect x="28" y="28" width="944" height="46" rx="8" fill="#ffffff" stroke="rgba(31,42,68,0.22)" stroke-width="0.9"/>
  <text x="46" y="56" fill="#5a6580" font-size="18" font-family="'TH Sarabun New', sans-serif" font-weight="600" >ข้อมูลนำเข้า</text>
  <text x="150" y="56" fill="#1f2a44" font-size="20" font-family="'TH Sarabun New', sans-serif">ตัวยา · รูปแบบยา · ประเทศ · วันที่ตัดสินใจ · วันที่คาดว่าจะวางตลาด</text>
  <line x1="134" y1="74" x2="134" y2="114" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Stage cards -->
  <g font-family="'TH Sarabun New', sans-serif">
    <!-- 1 -->
    <rect x="28" y="118" width="212" height="226" rx="8" fill="#ffffff" stroke="rgba(31,42,68,0.22)" stroke-width="0.9"/>
    <text x="44" y="142" fill="#5a6580" font-size="18" font-family="'TH Sarabun New', sans-serif" font-weight="600" >01 · ปัญหาข้อ 2</text>
    <text x="44" y="166" fill="#1f2a44" font-size="22" font-weight="600">พยากรณ์ช่วงเวลาตลาด</text>
    <g fill="#4f5d75" font-size="18.5">
      <text x="44" y="196">เวลายาสามัญรายแรก</text>
      <text x="44" y="218">คู่แข่ง ณ วันวางตลาด</text>
      <text x="44" y="240">ฉากทัศน์ราคา (สมมติฐาน)</text>
      <text x="44" y="262">ขนาดตลาดตั้งต้น</text>
    </g>
    <line x1="44" y1="300" x2="224" y2="300" stroke="rgba(31,42,68,0.12)" stroke-width="0.8"/>
    <text x="44" y="322" fill="#5a6580" font-size="18">ชุดทดสอบ C′: ผ่าน H1</text>

    <!-- 2 -->
    <rect x="272" y="118" width="212" height="226" rx="8" fill="#ffffff" stroke="rgba(31,42,68,0.22)" stroke-width="0.9"/>
    <text x="288" y="142" fill="#5a6580" font-size="18" font-family="'TH Sarabun New', sans-serif" font-weight="600" >02 · ปัญหาข้อ 1</text>
    <text x="288" y="166" fill="#1f2a44" font-size="22" font-weight="600">ชุดหลักฐานสิทธิบัตร</text>
    <g fill="#4f5d75" font-size="18.5">
      <text x="288" y="196">สิทธิบัตรแยกตามประเภท</text>
      <text x="288" y="218">สิทธิผูกขาดและวันหมดอายุ</text>
      <text x="288" y="240">การท้าทายและคดีความ</text>
      <text x="288" y="262">สิทธิบัตรที่ควรตรวจก่อน</text>
    </g>
    <line x1="288" y1="300" x2="468" y2="300" stroke="rgba(31,42,68,0.12)" stroke-width="0.8"/>
    <text x="288" y="322" fill="#5a6580" font-size="18">ทุกแถวมีแหล่งอ้างอิง</text>

    <!-- 3 -->
    <rect x="516" y="118" width="212" height="226" rx="8" fill="#ffffff" stroke="rgba(31,42,68,0.22)" stroke-width="0.9"/>
    <text x="532" y="142" fill="#5a6580" font-size="18" font-family="'TH Sarabun New', sans-serif" font-weight="600" >03 · บริบทไทย</text>
    <text x="532" y="166" fill="#1f2a44" font-size="22" font-weight="600">ไทยและอาเซียน</text>
    <g fill="#4f5d75" font-size="18.5">
      <text x="532" y="196">ทะเบียนตำรับยา อย.</text>
      <text x="532" y="218">เบาะแสตระกูลสิทธิบัตร</text>
      <text x="532" y="240">สถานะที่ยืนยันแล้ว หรือ</text>
      <text x="532" y="262">“ไม่ทราบ: ให้ตรวจเพิ่ม”</text>
    </g>
    <line x1="532" y1="300" x2="712" y2="300" stroke="rgba(31,42,68,0.12)" stroke-width="0.8"/>
    <text x="532" y="322" fill="#5a6580" font-size="18">แสดงหลักฐานที่ขาด</text>

    <!-- 4 focal -->
    <rect x="760" y="118" width="212" height="226" rx="8" fill="rgba(15,118,110,0.06)" stroke="#0f766e" stroke-width="1.6"/>
    <text x="776" y="142" fill="#0f766e" font-size="18" font-family="'TH Sarabun New', sans-serif" font-weight="600" >04 · ผลลัพธ์</text>
    <text x="776" y="166" fill="#1f2a44" font-size="22" font-weight="600">Market Window Dossier</text>
    <g fill="#4f5d75" font-size="18.5">
      <text x="776" y="196">หน้าตัดสินใจ R&amp;D/BD</text>
      <text x="776" y="218">เช็กลิสต์ผู้ประเมิน FTO</text>
      <text x="776" y="240">อ้างอิงรายข้อความ</text>
      <text x="776" y="262">ภาษาไทยและอังกฤษ</text>
    </g>
    <line x1="776" y1="300" x2="956" y2="300" stroke="rgba(15,118,110,0.25)" stroke-width="0.8"/>
    <text x="776" y="322" fill="#0f766e" font-size="18">ไม่ใช่ความเห็น FTO</text>
  </g>

  <!-- Stage arrows -->
  <line x1="240" y1="231" x2="268" y2="231" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="484" y1="231" x2="512" y2="231" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="728" y1="231" x2="756" y2="231" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-accent)"/>

  <!-- Evidence store feeds stages -->
  <g stroke="#4f5d75" stroke-width="1" stroke-dasharray="4 4">
    <line x1="134" y1="392" x2="134" y2="350" marker-end="url(#arrow)"/>
    <line x1="378" y1="392" x2="378" y2="350" marker-end="url(#arrow)"/>
    <line x1="622" y1="392" x2="622" y2="350" marker-end="url(#arrow)"/>
  </g>
  <rect x="28" y="394" width="700" height="78" rx="8" fill="rgba(31,42,68,0.04)" stroke="rgba(31,42,68,0.22)" stroke-width="0.9"/>
  <text x="46" y="418" fill="#5a6580" font-size="18" font-family="'TH Sarabun New', sans-serif" font-weight="600" >คลังหลักฐาน ณ วันตัดข้อมูล</text>
  <text x="46" y="442" fill="#1f2a44" font-size="19" font-family="'TH Sarabun New', sans-serif">ทุกข้อเท็จจริงเก็บแหล่งที่มา วันที่ รุ่น และค่าแฮช</text>
  <text x="46" y="461" fill="#4f5d75" font-size="18" font-family="'TH Sarabun New', sans-serif">Orange Book · Drugs@FDA · Purple Book · Paragraph IV · คดีความ · Medicaid · ทะเบียนไทย/อาเซียน</text>

  <!-- Evaluation -->
  <rect x="760" y="394" width="212" height="78" rx="8" fill="rgba(31,42,68,0.04)" stroke="rgba(31,42,68,0.22)" stroke-width="0.9"/>
  <text x="776" y="418" fill="#5a6580" font-size="18" font-family="'TH Sarabun New', sans-serif" font-weight="600" >การประเมินผล</text>
  <text x="776" y="442" fill="#1f2a44" font-size="18.5" font-family="'TH Sarabun New', sans-serif">ชุดทดสอบ C′: ผ่าน H1</text>
  <text x="776" y="461" fill="#1f2a44" font-size="18.5" font-family="'TH Sarabun New', sans-serif">ตรึง Track A: ภายใน 31 ม.ค. 2570</text>
  <line x1="866" y1="392" x2="866" y2="350" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

  <!-- Footer -->
  <text x="500" y="508" text-anchor="middle" fill="#5a6580" font-size="18" font-family="'TH Sarabun New', sans-serif" font-weight="600" >ใช้ประกอบการตัดสินใจเท่านั้น ผู้เชี่ยวชาญที่มีคุณสมบัติเป็นผู้ประเมิน FTO</text>
</svg>
</body>
</html>
