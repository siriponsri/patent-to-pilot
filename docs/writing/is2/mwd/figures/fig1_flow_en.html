<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Window Dossier flow</title>
<style>
  body { margin: 0; background: #ffffff; }
  svg { width: 1000px; height: 540px; display: block; }
</style>
</head>
<body>
<svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mwd-flow-title mwd-flow-desc">
  <title id="mwd-flow-title">Market Window Dossier flow</title>
  <desc id="mwd-flow-desc">A user enters a molecule, dosage form, jurisdiction, decision date and planned launch date. Stage one forecasts the launch window: first-generic timing, competitors at launch, a price-erosion scenario and a demand baseline. Stage two assembles patent and exclusivity evidence and ranks what to check first. Stage three adds Thai and ASEAN registration and patent status, showing unknown where evidence is missing. Stage four produces the Market Window Dossier: a decision page for BD and R&amp;D, an FTO evaluator checklist and claim-level references. All stages read from an as-of evidence store in which every fact is dated, sourced and hashed. Development evaluation and the sealed historical test (C′) are complete; on C′ the queue passed the first registered test (H1). Prospective Track A forecasts will be frozen before 31 January 2027, before any outcome is known. The system is decision support; qualified counsel determines freedom to operate.</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(31,42,68,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0f766e"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f7f7f4"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

  <!-- Input -->
  <rect x="28" y="28" width="944" height="46" rx="8" fill="#ffffff" stroke="rgba(31,42,68,0.22)" stroke-width="0.9"/>
  <text x="46" y="56" fill="#5a6580" font-size="12.8" font-family="ui-monospace, 'SF Mono', Consolas, monospace" letter-spacing="0.04em">INPUT</text>
  <text x="102" y="56" fill="#1f2a44" font-size="15" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">Molecule · dosage form · jurisdiction · decision date · planned launch date</text>
  <line x1="134" y1="74" x2="134" y2="114" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Stage cards -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <!-- 1 -->
    <rect x="28" y="118" width="212" height="226" rx="8" fill="#ffffff" stroke="rgba(31,42,68,0.22)" stroke-width="0.9"/>
    <text x="44" y="142" fill="#5a6580" font-size="12.8" font-family="ui-monospace, 'SF Mono', Consolas, monospace" letter-spacing="0.04em">01 · PAIN POINT 2</text>
    <text x="44" y="166" fill="#1f2a44" font-size="17" font-weight="600">Launch-window forecast</text>
    <g fill="#4f5d75" font-size="13.5">
      <text x="44" y="196">First-generic timing</text>
      <text x="44" y="218">Competitors at launch</text>
      <text x="44" y="240">Price scenario (assumption)</text>
      <text x="44" y="262">Demand baseline</text>
    </g>
    <line x1="44" y1="300" x2="224" y2="300" stroke="rgba(31,42,68,0.12)" stroke-width="0.8"/>
    <text x="44" y="322" fill="#5a6580" font-size="13">Sealed test (C′): H1 passed</text>

    <!-- 2 -->
    <rect x="272" y="118" width="212" height="226" rx="8" fill="#ffffff" stroke="rgba(31,42,68,0.22)" stroke-width="0.9"/>
    <text x="288" y="142" fill="#5a6580" font-size="12.8" font-family="ui-monospace, 'SF Mono', Consolas, monospace" letter-spacing="0.04em">02 · PAIN POINT 1</text>
    <text x="288" y="166" fill="#1f2a44" font-size="17" font-weight="600">Patent evidence pack</text>
    <g fill="#4f5d75" font-size="13.5">
      <text x="288" y="196">Listed patents by type</text>
      <text x="288" y="218">Exclusivities and dates</text>
      <text x="288" y="240">Challenges and litigation</text>
      <text x="288" y="262">Patent to check first</text>
    </g>
    <line x1="288" y1="300" x2="468" y2="300" stroke="rgba(31,42,68,0.12)" stroke-width="0.8"/>
    <text x="288" y="322" fill="#5a6580" font-size="13">Each row cites a source</text>

    <!-- 3 -->
    <rect x="516" y="118" width="212" height="226" rx="8" fill="#ffffff" stroke="rgba(31,42,68,0.22)" stroke-width="0.9"/>
    <text x="532" y="142" fill="#5a6580" font-size="12.8" font-family="ui-monospace, 'SF Mono', Consolas, monospace" letter-spacing="0.04em">03 · THAI CONTEXT</text>
    <text x="532" y="166" fill="#1f2a44" font-size="17" font-weight="600">Thailand and ASEAN</text>
    <g fill="#4f5d75" font-size="13.5">
      <text x="532" y="196">Thai FDA registration</text>
      <text x="532" y="218">Patent-family leads</text>
      <text x="532" y="240">Verified status, or</text>
      <text x="532" y="262">“unknown: verify at DIP”</text>
    </g>
    <line x1="532" y1="300" x2="712" y2="300" stroke="rgba(31,42,68,0.12)" stroke-width="0.8"/>
    <text x="532" y="322" fill="#5a6580" font-size="13">Gaps stay visible</text>

    <!-- 4 focal -->
    <rect x="760" y="118" width="212" height="226" rx="8" fill="rgba(15,118,110,0.06)" stroke="#0f766e" stroke-width="1.6"/>
    <text x="776" y="142" fill="#0f766e" font-size="12.8" font-family="ui-monospace, 'SF Mono', Consolas, monospace" letter-spacing="0.04em">04 · OUTPUT</text>
    <text x="776" y="166" fill="#1f2a44" font-size="17" font-weight="600">Market Window Dossier</text>
    <g fill="#4f5d75" font-size="13.5">
      <text x="776" y="196">BD and R&amp;D decision page</text>
      <text x="776" y="218">FTO evaluator checklist</text>
      <text x="776" y="240">Claim-level references</text>
      <text x="776" y="262">Thai and English</text>
    </g>
    <line x1="776" y1="300" x2="956" y2="300" stroke="rgba(15,118,110,0.25)" stroke-width="0.8"/>
    <text x="776" y="322" fill="#0f766e" font-size="13">Not an FTO opinion</text>
  </g>

  <!-- Stage arrows -->
  <line x1="240" y1="231" x2="268" y2="231" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="484" y1="231" x2="512" y2="231" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="728" y1="231" x2="756" y2="231" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-accent)"/>

  <!-- Evidence store feeds stages -->
  <g stroke="#4f5d75" stroke-width="1" stroke-dasharray="4 4">
    <line x1="134" y1="392" x2="134" y2="350" marker-end="url(#arrow)"/>
    <line x1="378" y1="392" x2="378" y2="350" marker-end="url(#arrow)"/>
    <line x1="622" y1="392" x2="622" y2="350" marker-end="url(#arrow)"/>
  </g>
  <rect x="28" y="394" width="700" height="78" rx="8" fill="rgba(31,42,68,0.04)" stroke="rgba(31,42,68,0.22)" stroke-width="0.9"/>
  <text x="46" y="418" fill="#5a6580" font-size="12.8" font-family="ui-monospace, 'SF Mono', Consolas, monospace" letter-spacing="0.04em">AS-OF EVIDENCE STORE</text>
  <text x="46" y="442" fill="#1f2a44" font-size="14" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">Each fact keeps its source, date, version and hash</text>
  <text x="46" y="461" fill="#4f5d75" font-size="13" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">Orange Book · Drugs@FDA · Purple Book · Paragraph IV · court records · Medicaid · Thai/ASEAN registers</text>

  <!-- Evaluation -->
  <rect x="760" y="394" width="212" height="78" rx="8" fill="rgba(31,42,68,0.04)" stroke="rgba(31,42,68,0.22)" stroke-width="0.9"/>
  <text x="776" y="418" fill="#5a6580" font-size="12.8" font-family="ui-monospace, 'SF Mono', Consolas, monospace" letter-spacing="0.04em">EVALUATION</text>
  <text x="776" y="442" fill="#1f2a44" font-size="13.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">Sealed test (C′): H1 passed</text>
  <text x="776" y="461" fill="#1f2a44" font-size="13.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">Track A freeze: by 31 Jan 2027</text>
  <line x1="866" y1="392" x2="866" y2="350" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

  <!-- Footer -->
  <text x="500" y="508" text-anchor="middle" fill="#5a6580" font-size="12.8" font-family="ui-monospace, 'SF Mono', Consolas, monospace" letter-spacing="0.04em">DECISION SUPPORT ONLY · QUALIFIED COUNSEL DETERMINES FREEDOM TO OPERATE</text>
</svg>
</body>
</html>
