<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 112" width="470" height="112" role="img" aria-label="Patent-to-Pilot logo: a chain of three evidence nodes rising to a highlighted endpoint, next to the wordmark">
  <title>Patent-to-Pilot</title>
  <style>
    .word { fill: #1f2328; }
    .tag { fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .word { fill: #e6edf3; }
      .tag { fill: #9198a1; }
    }
  </style>
  <rect x="8" y="12" width="88" height="88" rx="22" fill="#0f766e"/>
  <polyline points="30,76 52,58 52,44 74,34" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="30" cy="76" r="7" fill="#ffffff"/>
  <circle cx="52" cy="51" r="6" fill="#ffffff"/>
  <circle cx="74" cy="34" r="9" fill="#5eead4" stroke="#ffffff" stroke-width="4"/>
  <text x="120" y="64" class="word" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.5">Patent-to-Pilot</text>
  <text x="122" y="90" class="tag" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" letter-spacing="2">ADAPTIVE EVIDENCE ENGINE</text>
</svg>
