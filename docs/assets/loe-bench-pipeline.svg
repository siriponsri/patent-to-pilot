<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="loe-title loe-desc" id="loe-bench-pipeline-root">
  <title id="loe-title">LOE-Bench evidence pipeline</title>
  <desc id="loe-desc">Open regulatory sources, admitted only when public by each cutoff, feed one as-of evidence store. Three arms score the same rows: the B1 age clock, the M1 calibrated model and the M3 evidence graph with abstention. Paired AURC80 contrasts are evaluated on a sealed retrospective test and on prospective Track A forecasts.</desc>
  <defs>
    <pattern id="loe-bench-pipeline-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#1f2a44" fill-opacity="0.10"/>
    </pattern>
    <marker id="loe-bench-pipeline-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="loe-bench-pipeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0f766e"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f7f7f4"/>
  <rect width="100%" height="100%" fill="url(#loe-bench-pipeline-dots)" opacity="0.55"/>

  <!-- Zones -->
  <rect x="28" y="62" width="208" height="338" rx="8" fill="#1f2a44" stroke="#1f2a44" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.12"/>
  <text x="40" y="80" fill="#5a6580" font-size="8" font-family="ui-monospace, 'SF Mono', Consolas, monospace" letter-spacing="0.14em">OPEN SOURCES · AS-OF</text>
  <rect x="510" y="62" width="232" height="338" rx="8" fill="#1f2a44" stroke="#1f2a44" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.12"/>
  <text x="522" y="80" fill="#5a6580" font-size="8" font-family="ui-monospace, 'SF Mono', Consolas, monospace" letter-spacing="0.14em">ARMS · SAME ROWS</text>
  <rect x="776" y="62" width="196" height="338" rx="8" fill="#1f2a44" stroke="#1f2a44" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.12"/>
  <text x="788" y="80" fill="#5a6580" font-size="8" font-family="ui-monospace, 'SF Mono', Consolas, monospace" letter-spacing="0.14em">EVALUATION</text>

  <!-- Arrows: sources to store -->
  <line x1="218" y1="132" x2="254" y2="132" stroke="#4f5d75" stroke-width="1.2"/>
  <line x1="218" y1="232" x2="254" y2="232" stroke="#4f5d75" stroke-width="1.2"/>
  <line x1="218" y1="332" x2="254" y2="332" stroke="#4f5d75" stroke-width="1.2"/>
  <line x1="254" y1="132" x2="254" y2="332" stroke="#4f5d75" stroke-width="1.2"/>
  <line x1="254" y1="232" x2="288" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#loe-bench-pipeline-arrow)"/>

  <!-- Arrows: store to arms -->
  <line x1="460" y1="232" x2="490" y2="232" stroke="#4f5d75" stroke-width="1.2"/>
  <line x1="490" y1="132" x2="490" y2="332" stroke="#4f5d75" stroke-width="1.2"/>
  <line x1="490" y1="132" x2="523" y2="132" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#loe-bench-pipeline-arrow)"/>
  <line x1="490" y1="232" x2="523" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#loe-bench-pipeline-arrow)"/>
  <line x1="490" y1="332" x2="523" y2="332" stroke="#0f766e" stroke-width="1.4" marker-end="url(#loe-bench-pipeline-arrow-accent)"/>

  <!-- Arrows: arms to evaluation -->
  <line x1="725" y1="132" x2="758" y2="132" stroke="#4f5d75" stroke-width="1.2"/>
  <line x1="725" y1="232" x2="758" y2="232" stroke="#4f5d75" stroke-width="1.2"/>
  <line x1="725" y1="332" x2="758" y2="332" stroke="#0f766e" stroke-width="1.4"/>
  <line x1="758" y1="132" x2="758" y2="332" stroke="#4f5d75" stroke-width="1.2"/>
  <line x1="758" y1="176" x2="788" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#loe-bench-pipeline-arrow)"/>
  <line x1="758" y1="306" x2="788" y2="306" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#loe-bench-pipeline-arrow)"/>

  <!-- Arrow labels -->
  <rect x="294" y="176" width="136" height="12" rx="2" fill="#f7f7f4"/>
  <text x="362" y="185" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">PUBLIC BY CUTOFF ONLY</text>
  <rect x="762" y="236" width="62" height="12" rx="2" fill="#f7f7f4"/>
  <text x="793" y="245" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">ΔAURC80</text>

  <!-- Source nodes -->
  <rect x="42" y="96" width="176" height="72" rx="6" fill="#ffffff" stroke="#1f2a44" stroke-width="1" stroke-opacity="0.30"/>
  <text x="54" y="114" fill="#5a6580" font-size="7" font-family="ui-monospace, 'SF Mono', Consolas, monospace" letter-spacing="0.08em">PATENTS · EXCLUSIVITY</text>
  <text x="130" y="138" fill="#1f2a44" font-size="12" font-weight="600" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" text-anchor="middle">Orange Book editions</text>
  <text x="130" y="155" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Consolas, monospace" text-anchor="middle">NBER 1985–2016 · FDA ZIPs</text>

  <rect x="42" y="196" width="176" height="72" rx="6" fill="#ffffff" stroke="#1f2a44" stroke-width="1" stroke-opacity="0.30"/>
  <text x="54" y="214" fill="#5a6580" font-size="7" font-family="ui-monospace, 'SF Mono', Consolas, monospace" letter-spacing="0.08em">APPROVALS</text>
  <text x="130" y="238" fill="#1f2a44" font-size="12" font-weight="600" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" text-anchor="middle">Drugs@FDA · openFDA</text>
  <text x="130" y="255" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Consolas, monospace" text-anchor="middle">active-moiety keys</text>

  <rect x="42" y="296" width="176" height="72" rx="6" fill="#ffffff" stroke="#1f2a44" stroke-width="1" stroke-opacity="0.30"/>
  <text x="54" y="314" fill="#5a6580" font-size="7" font-family="ui-monospace, 'SF Mono', Consolas, monospace" letter-spacing="0.08em">CHALLENGES</text>
  <text x="130" y="338" fill="#1f2a44" font-size="12" font-weight="600" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" text-anchor="middle">Challenge witnesses</text>
  <text x="130" y="355" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Consolas, monospace" text-anchor="middle">PIV list · court filings</text>

  <!-- Store node -->
  <rect x="290" y="196" width="170" height="72" rx="6" fill="#1f2a44" stroke="#1f2a44" stroke-width="1" fill-opacity="0.05"/>
  <text x="302" y="214" fill="#1f2a44" font-size="7" font-family="ui-monospace, 'SF Mono', Consolas, monospace" letter-spacing="0.08em">S0 · SHA-256</text>
  <text x="375" y="238" fill="#1f2a44" font-size="12" font-weight="600" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" text-anchor="middle">As-of evidence store</text>
  <text x="375" y="255" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Consolas, monospace" text-anchor="middle">fresh ≤ 6 months · dated</text>

  <!-- Arm nodes -->
  <rect x="525" y="100" width="200" height="64" rx="6" fill="#ffffff" stroke="#1f2a44" stroke-width="1" stroke-opacity="0.30"/>
  <text x="537" y="118" fill="#5a6580" font-size="7" font-family="ui-monospace, 'SF Mono', Consolas, monospace" letter-spacing="0.08em">B1</text>
  <text x="625" y="136" fill="#1f2a44" font-size="12" font-weight="600" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" text-anchor="middle">Age clock</text>
  <text x="625" y="152" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Consolas, monospace" text-anchor="middle">hazard-table baseline</text>

  <rect x="525" y="200" width="200" height="64" rx="6" fill="#ffffff" stroke="#1f2a44" stroke-width="1" stroke-opacity="0.30"/>
  <text x="537" y="218" fill="#5a6580" font-size="7" font-family="ui-monospace, 'SF Mono', Consolas, monospace" letter-spacing="0.08em">M1</text>
  <text x="625" y="236" fill="#1f2a44" font-size="12" font-weight="600" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" text-anchor="middle">Calibrated model</text>
  <text x="625" y="252" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Consolas, monospace" text-anchor="middle">same evidence, flat</text>

  <rect x="525" y="300" width="200" height="64" rx="6" fill="#0f766e" stroke="#0f766e" stroke-width="1.2" fill-opacity="0.08"/>
  <text x="537" y="318" fill="#0f766e" font-size="7" font-family="ui-monospace, 'SF Mono', Consolas, monospace" letter-spacing="0.08em">M3 · PROPOSED</text>
  <text x="625" y="336" fill="#1f2a44" font-size="12" font-weight="600" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" text-anchor="middle">Evidence graph</text>
  <text x="625" y="352" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Consolas, monospace" text-anchor="middle">three-state verdict · abstain</text>
  <text x="625" y="386" fill="#0f766e" font-size="8" font-family="ui-monospace, 'SF Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">ENTRY · NO ENTRY · REFER</text>

  <!-- Evaluation nodes -->
  <rect x="790" y="140" width="170" height="72" rx="6" fill="#ffffff" stroke="#1f2a44" stroke-width="1"/>
  <text x="802" y="158" fill="#1f2a44" font-size="7" font-family="ui-monospace, 'SF Mono', Consolas, monospace" letter-spacing="0.08em">TRACK C′ · SEALED</text>
  <text x="875" y="182" fill="#1f2a44" font-size="12" font-weight="600" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" text-anchor="middle">Retrospective test</text>
  <text x="875" y="199" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Consolas, monospace" text-anchor="middle">2017+ · prereg hash</text>

  <rect x="790" y="270" width="170" height="72" rx="6" fill="#ffffff" stroke="#1f2a44" stroke-width="1"/>
  <text x="802" y="288" fill="#1f2a44" font-size="7" font-family="ui-monospace, 'SF Mono', Consolas, monospace" letter-spacing="0.08em">TRACK A · PROSPECTIVE</text>
  <text x="875" y="312" fill="#1f2a44" font-size="12" font-weight="600" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" text-anchor="middle">Frozen forecasts</text>
  <text x="875" y="329" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Consolas, monospace" text-anchor="middle">t0 2026-11-27</text>

  <!-- Footer -->
  <text x="500" y="440" fill="#5a6580" font-size="9" font-family="ui-monospace, 'SF Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">FIXED SEQUENCE  H1 M3 &lt; B1 (24 MO)  →  H2 M3 &lt; M1  →  H3 M3 &lt; B1 (12 MO)  ·  BOOTSTRAP BY DRUG</text>
</svg>
