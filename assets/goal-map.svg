<text x="106" y="1117" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#173744" text-anchor="start">Manuscript and reproducibility</text>
<text x="106" y="1152" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#58707B" text-anchor="start">Patent-central contribution and traceable results</text>
<text x="106" y="1181" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#58707B" text-anchor="start">Journal decisions are external outcomes</text>
<rect x="870" y="1050" width="650" height="156" rx="18" fill="#F3F8FA" stroke="#C7D5DD" stroke-width="2"/>
<rect x="870" y="1068" width="5" height="120" rx="2" fill="#008F86"/>
<text x="896" y="1081" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700" fill="#008F86" text-anchor="start" letter-spacing="1.5">HT-G7 · PRODUCT RELEASE</text>
<text x="896" y="1117" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#173744" text-anchor="start">An operable product</text>
<text x="896" y="1152" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#58707B" text-anchor="start">Setup, recovery, source history and no-code flow</text>
<text x="896" y="1181" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#58707B" text-anchor="start">Prepare a deployable build within authorization</text>
