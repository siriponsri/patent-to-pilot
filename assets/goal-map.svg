<text x="106" y="887" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#173744" text-anchor="start">Test adaptive acquisition</text>
<text x="106" y="922" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#58707B" text-anchor="start">Matched resources, grouping and ablations</text>
<text x="106" y="951" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#58707B" text-anchor="start">Keep positive, negative and uncertain findings</text>
<rect x="870" y="820" width="650" height="156" rx="18" fill="#F3F8FA" stroke="#C7D5DD" stroke-width="2"/>
<rect x="870" y="838" width="5" height="120" rx="2" fill="#008F86"/>
<text x="896" y="851" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700" fill="#008F86" text-anchor="start" letter-spacing="1.5">HT-G5 · USER EVIDENCE</text>
<text x="896" y="887" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#173744" text-anchor="start">Validate usefulness and payment</text>
<text x="896" y="922" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#58707B" text-anchor="start">Task completion, correction burden and reuse</text>
<text x="896" y="951" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#58707B" text-anchor="start">Run alongside research when the demo is ready</text>
<rect x="80" y="1050" width="650" height="156" rx="18" fill="#F3F8FA" stroke="#C7D5DD" stroke-width="2"/>
<rect x="80" y="1068" width="5" height="120" rx="2" fill="#3269A8"/>
