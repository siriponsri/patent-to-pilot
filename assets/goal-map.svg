<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1490" viewBox="0 0 1600 1490" role="img">
<title>Patent-to-Pilot goal map</title><desc>Outcome-led parallel research and product work. Local blockers affect only their dependent tasks; customer evidence informs releases without blocking unrelated work.</desc>
