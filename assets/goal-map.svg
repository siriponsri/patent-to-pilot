<rect x="450" y="183" width="5" height="90" rx="2" fill="#008F86"/>
<text x="476" y="196" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700" fill="#008F86" text-anchor="start" letter-spacing="1.5">HT-G0</text>
<text x="476" y="232" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#173744" text-anchor="start">One product and research contract</text>
<text x="476" y="267" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#58707B" text-anchor="start">A named-device dossier with a measurable research core</text>
<rect x="450" y="360" width="700" height="126" rx="18" fill="#F3F8FA" stroke="#C7D5DD" stroke-width="2"/>
<rect x="450" y="378" width="5" height="90" rx="2" fill="#008F86"/>
<text x="476" y="391" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700" fill="#008F86" text-anchor="start" letter-spacing="1.5">HT-G1</text>
<text x="476" y="427" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#173744" text-anchor="start">Source readiness and study protocol</text>
<text x="476" y="462" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#58707B" text-anchor="start">Use ready sources; do not wait for every dataset</text>
<rect x="80" y="590" width="650" height="156" rx="18" fill="#F3F8FA" stroke="#C7D5DD" stroke-width="2"/>
<rect x="80" y="608" width="5" height="120" rx="2" fill="#3269A8"/>
<text x="106" y="621" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700" fill="#3269A8" text-anchor="start" letter-spacing="1.5">HT-G2 · RESEARCH</text>
<text x="106" y="657" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#173744" text-anchor="start">Baselines and evaluators</text>
<text x="106" y="692" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#58707B" text-anchor="start">Reproducible outputs and complete cost records</text>
<text x="106" y="721" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#58707B" text-anchor="start">Establish headroom before adding complexity</text>
<rect x="870" y="590" width="650" height="156" rx="18" fill="#F3F8FA" stroke="#C7D5DD" stroke-width="2"/>
<rect x="870" y="608" width="5" height="120" rx="2" fill="#008F86"/>
