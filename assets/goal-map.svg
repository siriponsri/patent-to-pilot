<text x="896" y="657" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#173744" text-anchor="start">A complete public-case dossier</text>
<text x="896" y="692" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#58707B" text-anchor="start">Inspect sources, edit the table and export</text>
<text x="896" y="721" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#58707B" text-anchor="start">Use the simplest ready engine</text>
<rect x="80" y="820" width="650" height="156" rx="18" fill="#F3F8FA" stroke="#C7D5DD" stroke-width="2"/>
<rect x="80" y="838" width="5" height="120" rx="2" fill="#3269A8"/>
