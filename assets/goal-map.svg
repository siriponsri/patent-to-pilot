<rect width="1600" height="1490" rx="24" fill="white"/>
<text x="70" y="64" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#008F86" text-anchor="start" letter-spacing="2">GOAL-BASED DELIVERY</text>
<text x="70" y="116" font-family="DejaVu Sans,Arial,sans-serif" font-size="40" font-weight="700" fill="#173744" text-anchor="start">Progress through evidence, not dates.</text>
