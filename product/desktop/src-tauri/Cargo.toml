[package]
name = "market-window-dossier"
version = "0.1.0"
description = "Market Window Dossier desktop app"
authors = ["Patent-to-Pilot project, KMITL"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "mwd_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
